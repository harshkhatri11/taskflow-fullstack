<section class="unauthorized">
  <p class="unauthorized__code">403</p>

  <h1 class="unauthorized__heading">You don't have access to this page</h1>

  <p class="unauthorized__body">
    @if (currentUser(); as user) {
      Your account is signed in as <strong>{{ user.email }}</strong
      >, with the <strong>{{ user.role }}</strong> role. This page needs a different role.
    } @else {
      This page requires a role your account doesn't have.
    }
  </p>

  <div class="unauthorized__actions">
    <button mat-flat-button color="primary" (click)="goToDashboard()">Back to your projects</button>
    <button mat-stroked-button (click)="logout()">Sign out</button>
  </div>
</section>
